<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>New Year Effects</title>
<style>
:root {
  --bg: #161c2b; --panel: #1f2738; --row: #252e42; --line: #2f3a52;
  --text: #e8edf7; --muted: #9aa6bf; --accent: #4f9dff; --ok: #3ccf7a; --bad: #ff6b6b;
}
@media (prefers-color-scheme: light) {
  :root { --bg: #eef2f8; --panel: #ffffff; --row: #f6f8fc; --line: #dde3ee; --text: #1b2333; --muted: #5c6880; --accent: #1f6fe0; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px "Segoe UI", system-ui, sans-serif; }
.app { display: flex; height: 100%; }
nav { width: 210px; flex: none; padding: 14px 10px; border-right: 1px solid var(--line); overflow-y: auto; }
nav h1 { font-size: 15px; margin: 4px 10px 14px; font-weight: 600; }
nav button { display: flex; gap: 10px; align-items: center; width: 100%; border: 0; background: none; color: var(--text);
  font: inherit; text-align: left; padding: 9px 10px; border-radius: 8px; cursor: pointer; }
nav button:hover { background: var(--row); }
nav button.active { background: var(--accent); color: #fff; }
nav .ico { width: 22px; text-align: center; font-size: 16px; }
main { flex: 1; overflow-y: auto; padding: 18px 26px 40px; }
h2 { font-size: 20px; margin: 4px 0 6px; }
.desc { color: var(--muted); margin: 0 0 14px; line-height: 1.45; }
.group { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin: 14px 0; overflow: hidden; }
.group > h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0; padding: 12px 16px 4px; font-weight: 600; }
.group > .gdesc { color: var(--muted); padding: 0 16px 6px; margin: 0; font-size: 13px; line-height: 1.4; }
.row { display: flex; align-items: center; gap: 16px; padding: 11px 16px; border-top: 1px solid var(--line); }
.group > h3 + .row, .group > .gdesc + .row { border-top: 0; }
.row .label { flex: 1; min-width: 0; }
.row .title { font-weight: 500; }
.row .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; line-height: 1.35; }
.ctl { flex: none; display: flex; align-items: center; gap: 10px; }
input[type=range] { width: 160px; accent-color: var(--accent); }
input[type=number], input[type=text], select { background: var(--row); color: var(--text); border: 1px solid var(--line);
  border-radius: 7px; padding: 6px 8px; font: inherit; }
input[type=number] { width: 86px; }
input[type=text] { width: 170px; }
input.error { border-color: var(--bad); }
input[type=color] { width: 44px; height: 30px; border: 1px solid var(--line); border-radius: 7px; background: var(--row); padding: 2px; }
.switch { position: relative; width: 44px; height: 24px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 12px; transition: .15s; cursor: pointer; }
.switch span::before { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::before { transform: translateX(20px); }
button.act { background: var(--row); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px; font: inherit; cursor: pointer; }
button.act:hover { border-color: var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; }
.status { font-size: 12px; }
.status.ok { color: var(--ok); }
.status.busy { color: var(--bad); }
code { background: var(--row); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<div class="app">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<script src="settings.js"></script>
</body>
</html>
